name: Build and security check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release page
        run: python3 build.py
      - name: Static security check
        run: python3 scripts/security_check.py docs/index.html
      - name: Committed build must match the source
        run: git diff --exit-code -- docs/
